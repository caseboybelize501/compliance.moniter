# Alembic Configuration

[alembic]
# Path to migration scripts
script_location = server/db/alembic

# Template for migration messages
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Prepend sys.path with script location
prepend_sys_path = .

# Database URL (for autogenerate)
# This is overridden by alembic.ini sqla.url
sqla.url = driver://user:pass@localhost/dbname

# Target metadata for autogenerate
target_metadata = server.db.models:Base.metadata

# Render item type for autogenerate
render_item = false

# Include schemas in autogenerate
include_schemas = true

# Transaction per migration
transaction_per_migration = false

# Timezone for revision dates
timezone = UTC

# Output encoding
output_encoding = utf-8

# Revision environment
revision_environment = false

# Version table name
version_table = alembic_version

# Version table schema
version_table_schema = public


[post_write_hooks]
# Run black on generated migrations
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

# Run isort on generated migrations
# hooks = isort
# isort.type = console_scripts
# isort.entrypoint = isort
# isort.options = -q


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
